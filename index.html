<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal de trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#F8F6FC;--surface:#FFFFFF;--border:#E9E1F7;--border-strong:#CFC0EC;--text:#180E29;--text-secondary:#6B5C8F;--text-muted:#A296C4;--accent:#7C3AED;--accent-dark:#5B21B6;--accent-bg:#F1E9FC;--accent-glow:rgba(124,58,237,0.22);--success:#16A34A;--success-bg:#E7F7EE;--danger:#DC2626;--danger-bg:#FDECEC;--future-bg:#EDE4FC;--future-text:#6B21A8;--cfd-bg:#FBE6F5;--cfd-text:#A21C7E;--warn-bg:#FEF3C7;--warn-text:#92400E;--radius:14px;--radius-lg:20px;--shadow-sm:0 1px 2px rgba(24,14,41,0.06);--shadow-card:0 1px 3px rgba(24,14,41,0.07),0 1px 2px rgba(24,14,41,0.05);--shadow-hover:0 12px 24px rgba(124,58,237,0.12),0 2px 6px rgba(24,14,41,0.06);--shadow-modal:0 24px 60px rgba(24,14,41,0.18);--transition:.15s ease;}
[data-theme="dark"]{--bg:#0F0A1E;--surface:#1A1030;--border:#2D2050;--border-strong:#4A3570;--text:#F0EAFF;--text-secondary:#A899CC;--text-muted:#6B5C8F;--accent:#9D5FFF;--accent-dark:#7C3AED;--accent-bg:#2D1F4A;--accent-glow:rgba(157,95,255,0.25);--success:#22C55E;--success-bg:#0D2E1A;--danger:#F87171;--danger-bg:#2D0D0D;--future-bg:#2D1F4A;--future-text:#C084FC;--cfd-bg:#2E1130;--cfd-text:#E879F9;--warn-bg:#2D2000;--warn-text:#FCD34D;--shadow-sm:0 1px 2px rgba(0,0,0,0.4);--shadow-card:0 1px 3px rgba(0,0,0,0.4),0 1px 2px rgba(0,0,0,0.3);--shadow-hover:0 12px 24px rgba(157,95,255,0.18),0 2px 6px rgba(0,0,0,0.4);--shadow-modal:0 24px 60px rgba(0,0,0,0.6);}
*{box-sizing:border-box;transition:background-color var(--transition),border-color var(--transition),color var(--transition);}
body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(124,58,237,0.06),transparent 45%),var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
[data-theme="dark"] body{background:radial-gradient(circle at 15% 0%,rgba(157,95,255,0.08),transparent 45%),var(--bg);}
h1,h2,h3{font-family:'Manrope',sans-serif;font-weight:800;margin:0;letter-spacing:-0.01em;}
#app{max-width:980px;margin:0 auto;padding:32px 20px 90px;}
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:16px;flex-wrap:wrap;}.header-left{display:flex;align-items:center;gap:12px;}.logo-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px var(--accent-glow);flex-shrink:0;}.logo-mark svg{width:20px;height:20px;}.header h1{font-size:24px;}.header p{margin:2px 0 0;color:var(--text-secondary);font-size:13px;}.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}#user-email{font-size:12px;color:var(--text-muted);margin-right:2px;}
.btn{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:9px 16px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}.btn:hover{background:var(--bg);transform:translateY(-1px);}.btn:active{transform:translateY(0);}.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;box-shadow:0 6px 16px var(--accent-glow);}.btn-primary:hover{box-shadow:0 8px 20px var(--accent-glow);filter:brightness(1.05);}.btn-ghost{border-color:transparent;background:none;color:var(--text-secondary);padding:9px 12px;}.btn-ghost:hover{background:var(--bg);color:var(--text);}.btn-danger{color:var(--danger);}.btn-danger:hover{background:var(--danger-bg);}.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:8px;}.btn-plain{border:none;background:none;padding:6px;cursor:pointer;color:var(--text-secondary);border-radius:8px;transition:all .15s;font-size:14px;}.btn-plain:hover{color:var(--text);background:var(--bg);}
.account-switch{display:flex;gap:10px;margin-bottom:20px;}.account-btn{flex:1;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;padding:13px;border-radius:var(--radius);border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-secondary);cursor:pointer;transition:all .15s;text-align:center;}.account-btn:hover{border-color:var(--accent);}.account-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-color:transparent;color:#fff;box-shadow:0 6px 16px var(--accent-glow);}
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:0;overflow-x:auto;}.tab-btn{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;padding:10px 6px;margin-right:20px;border:none;background:none;color:var(--text-secondary);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;white-space:nowrap;}.tab-btn:hover{color:var(--text);}.tab-btn.active{color:var(--accent-dark);border-bottom-color:var(--accent);}.tab-panel{animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}@keyframes slideup{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-card);transition:box-shadow .2s,transform .2s;position:relative;overflow:hidden;}.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-dark));opacity:0;transition:opacity .2s;}.stat-card:hover::before{opacity:1;}.stat-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);}.stat-card .label{font-size:11px;color:var(--text-secondary);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}.stat-card .value{font-size:22px;font-weight:800;font-family:'Manrope',sans-serif;line-height:1.2;}.stat-card .sub{font-size:11px;color:var(--text-muted);margin-top:4px;}
.empty{background:var(--surface);border:1.5px dashed var(--border-strong);border-radius:var(--radius-lg);padding:52px 24px;text-align:center;color:var(--text-secondary);}.empty h3{color:var(--text);margin-bottom:8px;font-size:17px;}.empty svg{margin-bottom:14px;opacity:0.3;}.empty .btn{margin-top:16px;}
.trade-list{display:flex;flex-direction:column;gap:8px;}.trade-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:box-shadow .18s,transform .18s,border-color .18s;box-shadow:var(--shadow-sm);}.trade-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-hover);transform:translateY(-2px);}.trade-card.best-trade{border-color:var(--success);border-left:4px solid var(--success);}.trade-card.worst-trade{border-color:var(--danger);border-left:4px solid var(--danger);}.thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--bg);flex-shrink:0;}.thumb-placeholder{width:48px;height:48px;border-radius:9px;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:18px;border:1px solid var(--border);}.trade-main{flex:1;min-width:0;}.trade-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px;}.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;}.badge-future{background:var(--future-bg);color:var(--future-text);}.badge-cfd{background:var(--cfd-bg);color:var(--cfd-text);}.badge-best{background:#FEF3C7;color:#92400E;}.instrument{font-weight:700;font-size:14px;}.trade-sub{font-size:12px;color:var(--text-secondary);}.trade-result{font-family:'Manrope',sans-serif;font-size:17px;font-weight:800;white-space:nowrap;text-align:right;min-width:90px;}.result-pos{color:var(--success);}.result-neg{color:var(--danger);}.trade-r{font-size:11px;font-weight:600;color:var(--text-muted);margin-top:2px;text-align:right;}.trade-actions{display:flex;gap:2px;}
.search-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}.search-input{flex:1;min-width:180px;font-family:'Inter',sans-serif;font-size:13.5px;padding:9px 14px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text);}.search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}.filter-select{font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer;}
.overlay{position:fixed;inset:0;background:rgba(24,14,41,0.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto;z-index:100;animation:fadein .15s ease;}.modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:600px;padding:24px 26px 26px;box-shadow:var(--shadow-modal);animation:slideup .18s ease;}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}.modal-header h2{font-size:18px;}
.section-label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--border);}.section-label:first-child{margin-top:0;padding-top:0;border-top:none;}.field{margin-bottom:13px;}.field label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:5px;font-weight:600;}.field input,.field select,.field textarea{width:100%;font-family:'Inter',sans-serif;font-size:13.5px;padding:9px 11px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s;}.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.segmented{display:flex;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;background:var(--bg);}.segmented button{flex:1;padding:9px;border:none;background:transparent;color:var(--text-secondary);font-size:13.5px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;}.segmented button.active{background:var(--text);color:var(--surface);}
.preview-box{background:var(--bg);border-radius:12px;padding:11px 15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;border:1px solid var(--border);}.preview-box .label{font-size:12.5px;color:var(--text-secondary);font-weight:500;}.preview-box .value{font-family:'Manrope',sans-serif;font-size:18px;font-weight:800;}
.qlist{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:13px;}.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 13px;border-bottom:1px solid var(--border);flex-wrap:wrap;}.qrow:last-child{border-bottom:none;}.qrow:nth-child(even){background:var(--bg);}.qrow-label{font-size:12.5px;font-weight:600;color:var(--text);flex:1;min-width:140px;}.yn-toggle{display:flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;flex-shrink:0;}.yn-toggle button{padding:5px 12px;font-size:12px;font-weight:700;border:none;background:var(--surface);color:var(--text-secondary);cursor:pointer;}.yn-toggle button.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;}
.tf-chip-row{display:flex;gap:5px;flex-wrap:wrap;}.tf-chip{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-secondary);cursor:pointer;transition:all .15s;}.tf-chip:hover{border-color:var(--accent);color:var(--text);}.tf-chip.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-color:transparent;color:#fff;box-shadow:0 3px 8px var(--accent-glow);}
.photo-zone{border:1.5px dashed var(--border-strong);border-radius:12px;padding:12px;}.photo-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}.photo-thumb{position:relative;width:64px;height:80px;}.photo-thumb img{width:64px;height:64px;object-fit:cover;border-radius:8px;}.photo-thumb .remove{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:2px solid var(--surface);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}.photo-tf-select{position:absolute;bottom:0;left:0;width:100%;font-size:9px;font-weight:700;text-align:center;border:none;border-radius:0 0 6px 6px;background:var(--accent);color:#fff;padding:2px 0;appearance:none;-webkit-appearance:none;text-align-last:center;}.add-photo-label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent-dark);cursor:pointer;font-weight:600;}.add-photo-label input{display:none;}.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.pill-tag{display:inline-flex;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--text-secondary);border:1px solid var(--border);}.confirm-pill{display:inline-flex;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;}.confirm-pill.yes{background:var(--accent-bg);color:var(--accent-dark);}.confirm-pill.no{background:var(--bg);color:var(--text-muted);}.confirm-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.view-photos{position:relative;background:#0B1210;border-radius:12px;overflow:hidden;margin-bottom:14px;}.view-photos img{width:100%;height:260px;object-fit:contain;display:block;}.photo-tf-badge{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}.view-photos .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.9);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;}.view-photos .nav.prev{left:8px;}.view-photos .nav.next{right:8px;}.dots{display:flex;justify-content:center;gap:5px;padding:6px 0;}.dot{width:5px;height:5px;border-radius:50%;background:var(--border-strong);}.dot.active{background:var(--accent);}.view-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:14px;}.view-item .label{font-size:11px;color:var(--text-secondary);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}.view-item .val{font-size:14.5px;font-weight:700;}.view-notes{font-size:13.5px;color:var(--text);line-height:1.6;white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px 14px;border:1px solid var(--border);}.fx-note{font-size:10.5px;color:var(--text-muted);font-weight:500;margin-left:5px;}
.calendar-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:22px;box-shadow:var(--shadow-card);}.cal-header{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px;}.cal-header h3{font-size:15px;min-width:160px;text-align:center;}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}.cal-grid-labels{margin-bottom:4px;}.cal-label{text-align:center;font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;}.cal-cell{position:relative;border-radius:8px;padding:5px 4px;min-height:52px;background:var(--bg);border:1px solid var(--border);font-size:10.5px;cursor:pointer;transition:transform .1s,box-shadow .15s;}.cal-cell:hover{transform:scale(1.04);box-shadow:var(--shadow-hover);}.cal-cell.empty{background:transparent;border:none;cursor:default;}.cal-cell.empty:hover{transform:none;box-shadow:none;}.cal-cell.cal-pos{background:var(--success-bg);border-color:transparent;}.cal-cell.cal-neg{background:var(--danger-bg);border-color:transparent;}.cal-day{font-weight:700;color:var(--text-secondary);font-size:10.5px;}.cal-cell.cal-pos .cal-day{color:var(--success);}.cal-cell.cal-neg .cal-day{color:var(--danger);}.cal-amt{font-weight:700;margin-top:3px;font-size:10px;}.cal-cell.cal-pos .cal-amt{color:var(--success);}.cal-cell.cal-neg .cal-amt{color:var(--danger);}.cal-count{font-size:9px;color:var(--text-muted);margin-top:1px;}.cal-recap-btn{position:absolute;top:2px;right:2px;border:none;background:rgba(255,255,255,0.7);border-radius:5px;font-size:9px;padding:1px 3px;cursor:pointer;opacity:0.5;transition:opacity .15s;}.cal-recap-btn:hover{opacity:1;}.cal-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--border);}.cal-summary .label{display:block;font-size:10.5px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}.cal-summary .val{font-family:'Manrope',sans-serif;font-size:16px;font-weight:800;}
