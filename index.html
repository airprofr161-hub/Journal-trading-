function computeResult(entry,exit,size,sens){var dir=sens==="vente"?-1:1;var e=parseFloat(entry),x=parseFloat(exit),s=parseFloat(size);if(isNaN(e)||isNaN(x)||isNaN(s))return 0;return(x-e)*s*dir;}
function computeRisk(entry,sl,size){var e=parseFloat(entry),s=parseFloat(size),stop=parseFloat(sl);if(isNaN(e)||isNaN(s)||isNaN(stop))return null;return Math.abs(e-stop)*s;}
function showToast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;document.getElementById("toast-container").appendChild(t);setTimeout(function(){t.remove();},2200);}
function launchConfetti(){var c=document.getElementById("confetti-container");var cols=["#DC2626","#00FF87","#EAB308","#FFF","#FF4444"];for(var i=0;i<35;i++){var el=document.createElement("div");el.className="confetti-piece";el.style.cssText="left:"+Math.random()*100+"%;top:-8px;background:"+cols[Math.floor(Math.random()*cols.length)]+";width:"+(3+Math.random()*4)+"px;height:"+(3+Math.random()*4)+"px;border-radius:"+(Math.random()>.5?"50%":"1px")+";animation-delay:"+Math.random()*0.5+"s;animation-duration:"+(1.8+Math.random())+"s;";c.appendChild(el);}setTimeout(function(){c.innerHTML="";},3000);}
function setAccount(acc){currentAccount=acc;document.getElementById("nav-fp").classList.toggle("active",acc==="fonds-propres");document.getElementById("nav-pf").classList.toggle("active",acc==="prop-firm");render();renderGoalBanner();}
function loadGoals(){try{var s=localStorage.getItem("tp-goals-"+currentAccount);if(s)goals=JSON.parse(s);}catch(e){goals={monthlyTarget:0,maxDailyLoss:0,maxTrades:0};}}
function saveGoals(){localStorage.setItem("tp-goals-"+currentAccount,JSON.stringify(goals));}
function openGoalsModal(){loadGoals();var o=document.createElement("div");o.className="overlay";o.id="goals-overlay";o.innerHTML="<div class='modal'><div class='modal-header'><h2>Objectifs</h2><button class='icon-btn' onclick=\"document.getElementById('goals-overlay').remove()\">x</button></div><div class='modal-body'><div class='field'><label>Target mensuel ($)</label><input type='number' step='any' id='g-target' value='"+(goals.monthlyTarget||"")+"'></div><div class='field'><label>Max loss / jour ($)</label><input type='number' step='any' id='g-maxloss' value='"+(goals.maxDailyLoss||"")+"'></div><div class='field'><label>Max trades / jour</label><input type='number' id='g-maxtrades' value='"+(goals.maxTrades||"")+"'></div></div><div class='modal-footer'><button class='btn' onclick=\"document.getElementById('goals-overlay').remove()\">Annuler</button><button class='btn btn-primary' id='goals-save'>Sauver</button></div></div>";document.body.appendChild(o);document.getElementById("goals-save").addEventListener("click",function(){goals.monthlyTarget=parseFloat(document.getElementById("g-target").value)||0;goals.maxDailyLoss=parseFloat(document.getElementById("g-maxloss").value)||0;goals.maxTrades=parseInt(document.getElementById("g-maxtrades").value)||0;saveGoals();o.remove();renderGoalBanner();showToast("OK");});}
function renderGoalBanner(){loadGoals();var el=document.getElementById("goal-banner");if(!goals.monthlyTarget||goals.monthlyTarget<=0){el.style.display="none";return;}el.style.display="block";var mt=tradesInMonth(calYear,calMonth);var tot=mt.reduce(function(s,t){return s+t.result;},0);var pct=Math.min(100,Math.max(0,(tot/goals.monthlyTarget)*100));var color=tot>=goals.monthlyTarget?"#00FF87":tot>=0?"#EAB308":"#DC2626";el.innerHTML="<div class='cyber-border' style='padding:12px 16px;margin-bottom:16px;'><div style='display:flex;justify-content:space-between;margin-bottom:5px;'><span style='font-size:8px;font-weight:800;color:#777;text-transform:uppercase;letter-spacing:0.1em;'>Target "+MONTH_NAMES[calMonth]+"</span><span style='font-size:9px;color:#555;font-family:JetBrains Mono,monospace;'>"+pct.toFixed(0)+"%</span></div><div style='height:3px;background:#111;border-radius:99px;overflow:hidden;'><div style='height:100%;width:"+pct+"%;background:"+color+";border-radius:99px;transition:width .4s;box-shadow:0 0 8px "+color+";'></div></div><div style='font-size:9px;color:#444;margin-top:4px;font-family:JetBrains Mono,monospace;'>"+usd(tot)+" / "+usd(goals.monthlyTarget)+"</div></div>";}
function calculateStreak(){var view=filteredTrades();if(!view.length)return{current:0,best:0,dir:1};var byDate={};view.forEach(function(t){byDate[t.date]=(byDate[t.date]||0)+t.result;});var dates=Object.keys(byDate).sort();if(!dates.length)return{current:0,best:0,dir:1};var currentStreak=0,bestStreak=0;var lastVal=byDate[dates[dates.length-1]];var dir=lastVal>=0?1:-1;for(var i=dates.length-1;i>=0;i--){if((byDate[dates[i]]>=0&&dir===1)||(byDate[dates[i]]<0&&dir===-1))currentStreak++;else break;}var streak=0;for(var j=0;j<dates.length;j++){if(byDate[dates[j]]>=0){streak++;bestStreak=Math.max(bestStreak,streak);}else streak=0;}return{current:currentStreak,best:bestStreak,dir:dir};}
function calculateMaxDD(view){if(!view.length)return 0;var sorted=view.slice().sort(function(a,b){return a.date.localeCompare(b.date);});var eq=0,peak=0,maxDD=0;sorted.forEach(function(t){eq+=t.result;if(eq>peak)peak=eq;var dd=peak-eq;if(dd>maxDD)maxDD=dd;});return maxDD;}
function getBestWorst(view){if(!view.length)return{best:0,worst:0};var best=view.reduce(function(m,t){return t.result>m?t.result:m;},view[0].result);var worst=view.reduce(function(m,t){return t.result<m?t.result:m;},view[0].result);return{best:best,worst:worst};}
function isConfigured(){return firebaseConfig.apiKey&&firebaseConfig.apiKey!=="REMPLACE_MOI";}

function initApp(){if(!isConfigured()){document.getElementById("auth-content").innerHTML="<div style='text-align:center;padding:60px;color:#444;'>Config Firebase requise.</div>";return;}firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(function(user){currentUser=user;if(user){document.getElementById("sidebar-footer").style.display="block";document.getElementById("auth-content").innerHTML="";document.getElementById("user-email").textContent=user.email;setAccount("fonds-propres");document.getElementById("nav-fp").classList.add("active");switchTab("calendar");loadTrades();}else{document.getElementById("sidebar-footer").style.display="none";document.getElementById("goal-banner").style.display="none";switchTab("calendar");renderPreview();}});}

function renderList(){var el=document.getElementById("tab-transactions");if(!currentUser){el.innerHTML="<div style='text-align:center;padding:50px;color:#444;'>Connectez-vous pour voir vos transactions.</div>";return;}var view=filteredTrades();var instruments=[];filteredTrades().forEach(function(t){if(instruments.indexOf(t.instrumentCode)===-1)instruments.push(t.instrumentCode);});var html="<div class='page-header'><div><h2>Transactions</h2><div class='sub'>"+filteredTrades().length+" trades</div></div><button class='btn btn-green' onclick='openForm(null)'>+ Nouveau</button></div>";if(!view.length){html+="<div style='text-align:center;padding:40px;color:#444;'>Aucun trade</div>";}else{html+="<div class='panel' style='overflow-x:auto;'><table class='trade-table'><thead><tr><th>Date</th><th>Instrument</th><th>Dir.</th><th>P&L</th><th>R</th><th></th></tr></thead><tbody>"+view.map(function(t){var pos=t.result>=0;var rTag=(typeof t.rMultiple==="number"&&isFinite(t.rMultiple))?(t.rMultiple>=0?"+":"")+t.rMultiple.toFixed(1)+"R":"--";return "<tr onclick=\"openView('"+t.id+"')\"><td class='mono'>"+formatDate(t.date)+"</td><td><span class='tag "+(t.type==="Future"?"tag-future":"tag-cfd")+"'>"+t.type+"</span> "+t.instrumentLabel+"</td><td>"+(t.sens==="achat"?"L":"S")+"</td><td class='mono "+(pos?"pos":"neg")+"'>"+(pos?"+":"")+usd(t.result)+"</td><td class='mono'>"+rTag+"</td><td><button class='icon-btn' onclick=\"event.stopPropagation();openForm('"+t.id+"')\">e</button><button class='icon-btn' onclick=\"event.stopPropagation();confirmDelete('"+t.id+"')\">x</button></td></tr>";}).join("")+"</tbody></table></div>";}el.innerHTML=html;}
function confirmDelete(id){if(confirm("Supprimer ?")){trades=trades.filter(function(t){return t.id!==id;});render();deleteTradeFromStorage(id);}}
function renderAnalytics(){var el=document.getElementById("tab-analytics");if(!currentUser){el.innerHTML="<div style='text-align:center;padding:50px;color:#444;'>Connectez-vous.</div>";return;}var view=filteredTrades();if(view.length<2){el.innerHTML="<div style='text-align:center;padding:50px;color:#444;'>Min 2 trades</div>";return;}var sorted=view.slice().sort(function(a,b){return a.date.localeCompare(b.date);});var eq=0;var eqD=sorted.map(function(t){eq+=t.result;return eq;});el.innerHTML="<div class='page-header'><div><h2>Analytics</h2></div></div><div class='chart-panel'><h3>Equity</h3><canvas id='ch-eq' height='70'></canvas></div>";new Chart(document.getElementById("ch-eq"),{type:"line",data:{labels:sorted.map(function(t){return formatDate(t.date);}),datasets:[{data:eqD,borderColor:"#DC2626",backgroundColor:"rgba(220,38,38,0.02)",fill:true,tension:0.4,pointRadius:1,borderWidth:1.5}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#333",maxTicksLimit:6,font:{size:8}},grid:{color:"rgba(255,255,255,0.02)"}},y:{ticks:{color:"#333",font:{size:8}},grid:{color:"rgba(255,255,255,0.02)"}}}}});}
function renderCalculator(){var el=document.getElementById("tab-calculator");if(!currentUser){el.innerHTML="<div style='text-align:center;padding:50px;color:#444;'>Connectez-vous.</div>";return;}el.innerHTML="<div class='page-header'><div><h2>Calculateur</h2></div></div><div class='calc-section'><div class='row2'><div class='field'><label>Entree</label><input type='number' step='any' id='c-entry' oninput='calcAll()'></div><div class='field'><label>Sortie</label><input type='number' step='any' id='c-exit' oninput='calcAll()'></div></div><div class='row2'><div class='field'><label>Taille</label><input type='number' step='any' id='c-size' value='1' oninput='calcAll()'></div><div class='field'><label>Direction</label><select id='c-sens' onchange='calcAll()'><option value='achat'>Long</option><option value='vente'>Short</option></select></div></div><div class='result-box'><span class='lbl'>Resultat</span><span class='val' id='c-result'>--</span></div><div class='divider'></div><div class='row2'><div class='field'><label>Capital ($)</label><input type='number' step='any' id='c-capital' oninput='calcSize()'></div><div class='field'><label>Risque (%)</label><input type='number' step='any' id='c-riskpct' value='1' oninput='calcSize()'></div></div><div class='row2'><div class='field'><label>Entree</label><input type='number' step='any' id='c-s-entry' oninput='calcSize()'></div><div class='field'><label>Stop loss</label><input type='number' step='any' id='c-s-sl' oninput='calcSize()'></div></div><div class='result-box'><span class='lbl'>Taille recommandee</span><span class='val' id='c-recsize'>--</span></div><div class='divider'></div><div class='row2'><div class='field'><label>Entree</label><input type='number' step='any' id='c-r-entry' oninput='calcRR()'></div><div class='field'><label>Stop loss</label><input type='number' step='any' id='c-r-sl' oninput='calcRR()'></div></div><div class='row2'><div class='field'><label>Take profit</label><input type='number' step='any' id='c-r-tp' oninput='calcRR()'></div><div class='field'><label>Taille</label><input type='number' step='any' id='c-r-size' value='1' oninput='calcRR()'></div></div><div class='result-box'><span class='lbl'>Ratio R:R</span><span class='val' id='c-r-rr'>--</span></div></div>";}
function calcAll(){var e=document.getElementById("c-entry").value,x=document.getElementById("c-exit").value,s=document.getElementById("c-size").value,d=document.getElementById("c-sens").value;var el=document.getElementById("c-result");if(e&&x&&s){var r=computeResult(e,x,s,d);el.textContent=(r>=0?"+":"")+usd(r);el.style.color=r>=0?"#00FF87":"#DC2626";}else{el.textContent="--";el.style.color="#F0F0F0";}}
function calcSize(){var cap=parseFloat(document.getElementById("c-capital").value),pct=parseFloat(document.getElementById("c-riskpct").value),en=parseFloat(document.getElementById("c-s-entry").value),sl=parseFloat(document.getElementById("c-s-sl").value);var sEl=document.getElementById("c-recsize");if(!isNaN(cap)&&!isNaN(pct)&&pct>0&&!isNaN(en)&&!isNaN(sl)&&en!==sl){var amt=cap*(pct/100);var dist=Math.abs(en-sl);sEl.textContent=Math.floor(amt/dist)+" contrats";}else{sEl.textContent="--";}}
function calcRR(){var en=parseFloat(document.getElementById("c-r-entry").value),sl=parseFloat(document.getElementById("c-r-sl").value),tp=parseFloat(document.getElementById("c-r-tp").value),sz=parseFloat(document.getElementById("c-r-size").value)||1;var rrEl=document.getElementById("c-r-rr");if(!isNaN(en)&&!isNaN(sl)&&!isNaN(tp)&&en!==sl){var risk=Math.abs(en-sl)*sz;var reward=Math.abs(tp-en)*sz;var rr=risk>0?(reward/risk):0;rrEl.textContent="1 : "+rr.toFixed(2);rrEl.style.color=rr>=2?"#00FF87":rr>=1?"#EAB308":"#DC2626";}else{rrEl.textContent="--";rrEl.style.color="#F0F0F0";}}
function openForm(id,prefillDate){editingId=id||null;var existing=id?trades.find(function(t){return t.id===id;}):null;formPhotos=[];var defAcc=existing?(existing.accountType||"fonds-propres"):currentAccount;var typeVal=existing?existing.type:"Future";var o=document.createElement("div");o.className="overlay";o.id="form-overlay";var allInst=getInstruments(typeVal);o.innerHTML="<div class='modal'><div class='modal-header'><h2>"+(existing?"Modifier":"Nouveau Trade")+"</h2><button class='icon-btn' id='form-close'>x</button></div><div class='modal-body'><div class='field'><label>Type</label><div class='seg' id='type-seg'><button type='button' data-val='Future' class='"+(typeVal==="Future"?"active":"")+"'>Future</button><button type='button' data-val='CFD' class='"+(typeVal==="CFD"?"active":"")+"'>CFD</button></div></div><div class='row2'><div class='field'><label>Instrument</label><select id='f-inst'>"+allInst.map(function(i){return "<option value='"+i.code+"'>"+i.code+" - "+i.name+"</option>";}).join("")+"</select></div><div class='field'><label>Direction</label><select id='f-sens'><option value='achat'>Long</option><option value='vente'>Short</option></select></div></div><div class='row2'><div class='field'><label>Date</label><input type='date' id='f-date'></div><div class='field'><label>Heure</label><input type='time' id='f-time'></div></div><div class='row2'><div class='field'><label>Entree</label><input type='number' step='any' id='f-entry'></div><div class='field'><label>Sortie</label><input type='number' step='any' id='f-exit'></div></div><div class='field'><label>Taille</label><input type='number' step='any' id='f-size' placeholder='1'></div><div class='row2'><div class='field'><label>Stop loss</label><input type='number' step='any' id='f-sl'></div><div class='field'><label>Take profit</label><input type='number' step='any' id='f-tp'></div></div><div class='divider'></div><div class='row2'><div class='field'><label>Session</label><select id='f-session'>"+SESSIONS.map(function(s){return "<option value='"+s+"'>"+s+"</option>";}).join("")+"</select></div><div class='field'><label>Emotion</label><select id='f-emotion'>"+EMOTIONS.map(function(s){return "<option value='"+s+"'>"+s+"</option>";}).join("")+"</select></div></div><div class='row2'><div class='field'><label>Setup</label><input type='text' id='f-setup'></div><div class='field'><label>Plan respecte</label><select id='f-respect'><option value='oui'>Oui</option><option value='non'>Non</option></select></div></div><div class='field'><label>Notes</label><textarea id='f-notes' rows='2'></textarea></div></div><div class='modal-footer'><button class='btn' id='form-cancel'>Annuler</button><button class='btn btn-green' id='form-save'>Sauvegarder</button></div></div>";document.body.appendChild(o);document.querySelectorAll("#type-seg button").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll("#type-seg button").forEach(function(x){x.classList.remove("active");});b.classList.add("active");var inst=getInstruments(b.dataset.val);document.getElementById("f-inst").innerHTML=inst.map(function(i){return "<option value='"+i.code+"'>"+i.code+" - "+i.name+"</option>";}).join("");});});if(existing){document.getElementById("f-inst").value=existing.instrumentCode;document.getElementById("f-sens").value=existing.sens;document.getElementById("f-date").value=existing.date;document.getElementById("f-time").value=existing.entryTime||"";document.getElementById("f-entry").value=existing.entryPrice;document.getElementById("f-exit").value=existing.exitPrice;document.getElementById("f-size").value=existing.size;document.getElementById("f-sl").value=existing.stopLoss!=null?existing.stopLoss:"";document.getElementById("f-tp").value=existing.takeProfit!=null?existing.takeProfit:"";document.getElementById("f-session").value=existing.session||SESSIONS[0];document.getElementById("f-emotion").value=existing.emotion||EMOTIONS[0];document.getElementById("f-setup").value=existing.setup||"";document.getElementById("f-respect").value=existing.respectPlan||"oui";document.getElementById("f-notes").value=existing.notes||"";}else{document.getElementById("f-date").value=prefillDate||new Date().toISOString().slice(0,10);}document.getElementById("form-close").addEventListener("click",closeForm);document.getElementById("form-cancel").addEventListener("click",closeForm);document.getElementById("form-save").addEventListener("click",saveForm);}
function closeForm(){var o=document.getElementById("form-overlay");if(o)o.remove();editingId=null;}
async function saveForm(){var type=document.querySelector("#type-seg button.active").dataset.val;var code=document.getElementById("f-inst").value;var obj=getInstruments(type).find(function(i){return i.code===code;});var label=obj?obj.code+" - "+obj.name:"Autre";var sens=document.getElementById("f-sens").value;var date=document.getElementById("f-date").value||new Date().toISOString().slice(0,10);var time=document.getElementById("f-time").value;var entry=parseFloat(document.getElementById("f-entry").value)||0;var exit=parseFloat(document.getElementById("f-exit").value)||0;var size=parseFloat(document.getElementById("f-size").value)||0;var slR=document.getElementById("f-sl").value;var tpR=document.getElementById("f-tp").value;var sl=slR?parseFloat(slR):null;var tp=tpR?parseFloat(tpR):null;var session=document.getElementById("f-session").value;var emotion=document.getElementById("f-emotion").value;var setup=document.getElementById("f-setup").value.trim();var respect=document.getElementById("f-respect").value;var notes=document.getElementById("f-notes").value;var result=computeResult(entry,exit,size,sens);var risk=computeRisk(entry,sl,size);var rMult=(risk&&risk>0)?result/risk:null;var trade={id:editingId||(Date.now().toString(36)+Math.random().toString(36).slice(2,7)),accountType:currentAccount,type:type,instrumentCode:code,instrumentLabel:label,sens:sens,date:date,entryTime:time,entryPrice:entry,exitPrice:exit,size:size,result:result,stopLoss:sl,takeProfit:tp,risk:risk,rMultiple:rMult,session:session,emotion:emotion,setup:setup,respectPlan:respect,photos:[],notes:notes,propFirm:"Aucun",confirmations:{},sessionLiquidity:{},extraQuestions:{},grade:"B",mistakes:[]};if(editingId)trades=trades.map(function(t){return t.id===editingId?trade:t;});else trades.push(trade);trades.sort(function(a,b){return(b.date+b.id).localeCompare(a.date+a.id);});if(result>0)setTimeout(launchConfetti,100);render();closeForm();await saveTradeToStorage(trade);showToast("OK");}
function openView(id){var t=trades.find(function(x){return x.id===id;});if(!t)return;var o=document.createElement("div");o.className="overlay";o.id="view-overlay";var pos=t.result>=0;var rTag=(typeof t.rMultiple==="number"&&isFinite(t.rMultiple))?(t.rMultiple>=0?"+":"")+t.rMultiple.toFixed(2)+"R":"--";o.innerHTML="<div class='modal'><div class='modal-header'><h2>"+t.instrumentLabel+"</h2><button class='icon-btn' onclick=\"document.getElementById('view-overlay').remove()\">x</button></div><div class='modal-body'><div class='view-grid'><div class='view-item'><div class='lbl'>Date</div><div class='val'>"+formatDate(t.date)+"</div></div><div class='view-item'><div class='lbl'>Resultat</div><div class='val' style='color:"+(pos?"#00FF87":"#DC2626")+"'>"+(pos?"+":"")+usd(t.result)+"</div></div><div class='view-item'><div class='lbl'>Entree</div><div class='val'>"+usd(t.entryPrice)+"</div></div><div class='view-item'><div class='lbl'>Sortie</div><div class='val'>"+usd(t.exitPrice)+"</div></div><div class='view-item'><div class='lbl'>Taille</div><div class='val'>"+t.size+"</div></div><div class='view-item'><div class='lbl'>R</div><div class='val'>"+rTag+"</div></div></div>"+(t.notes?"<div class='notes-block'>"+escapeHtml(t.notes)+"</div>":"")+"</div><div class='modal-footer'><button class='btn btn-danger' onclick=\"document.getElementById('view-overlay').remove();confirmDelete('"+t.id+"')\">Supprimer</button><button class='btn btn-green' onclick=\"document.getElementById('view-overlay').remove();openForm('"+t.id+"')\">Modifier</button></div></div>";document.body.appendChild(o);}
function exportData(){var b=new Blob([JSON.stringify(trades,null,2)],{type:"application/json"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="tradepro.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);showToast("Export OK");}
